<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSMS Leeromgeving &middot; Semester 1</title>
<meta name="theme-color" content="#F6F2EE">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
    --paper:#F6F2EE; --paper2:#EFE9E3; --surface:#FFFDFB;
    --ink:#231C24; --ink2:#4A3F49; --muted:#6F6470; --line:#E3D9D2;
    --accent:#AE7189; --accent-soft:#F3E5EA; --sage:#7F9280; --sage-soft:#E8EEE7;
    --shadow:0 1px 2px rgba(35,28,36,.05), 0 18px 40px -28px rgba(35,28,36,.28);
    --serif:"Newsreader",Georgia,serif;
    --sans:"Public Sans",system-ui,-apple-system,sans-serif;
  }
  html[data-mode="dark"]{
    --paper:#171316; --paper2:#1F191E; --surface:#211B21;
    --ink:#F4EDEF; --ink2:#D3C6CC; --muted:#A2949B; --line:#332A31;
    --accent:#D69AAF; --accent-soft:#33242B; --sage:#9CB39C; --sage-soft:#232B24;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 24px 50px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;transition:background .4s ease,color .4s ease;
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{color:var(--ink);}
  button{font:inherit;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px 72px;}

  /* ---- topbalk ---- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:34px 0 0;animation:fadein .6s ease both;}
  .merk{display:flex;align-items:center;gap:14px;}
  .zegel{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--surface);font-family:var(--serif);font-size:17px;line-height:1;padding-bottom:2px;}
  .merk b{font-size:13.5px;font-weight:600;display:block;}
  .merk span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
  .tools{display:flex;align-items:center;gap:10px;}
  .zoek{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px;width:270px;box-shadow:var(--shadow);}
  .zoek i{width:11px;height:11px;border:1.5px solid var(--muted);border-radius:50%;flex:none;}
  .zoek input{border:none;outline:none;background:none;font:inherit;font-size:13px;color:var(--ink);width:100%;}
  .zoek input::placeholder{color:var(--muted);}
  .rond{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;font-size:13px;box-shadow:var(--shadow);transition:transform .2s ease,color .2s ease;}
  .rond:hover{transform:translateY(-1px);color:var(--accent);}

  /* ---- zoekresultaten ---- */
  #resultaten{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--shadow);animation:rise .35s ease both;}
  #resultaten[hidden]{display:none;}
  .res{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 16px;border-radius:14px;cursor:pointer;transition:background .18s ease;}
  .res:hover{background:var(--paper2);}
  .res b{font-family:var(--serif);font-size:17px;font-weight:400;}
  .res span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;}

  /* ---- hero ---- */
  .hero{display:grid;grid-template-columns:1.35fr .65fr;gap:56px;align-items:end;padding:52px 0 34px;border-bottom:1px solid var(--line);animation:rise .7s ease both;}
  .datum{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
  .hero h1{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(34px,4.6vw,60px);line-height:1.04;letter-spacing:-.02em;text-wrap:pretty;}
  .hero h1 em{font-style:italic;color:var(--accent);}
  .hero p{margin:18px 0 0;max-width:44ch;font-size:14.5px;line-height:1.65;color:var(--ink2);text-wrap:pretty;}
  .acties{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .btn{border:none;border-radius:999px;background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:500;padding:13px 26px;cursor:pointer;transition:transform .2s ease,opacity .2s ease;}
  .btn:hover{transform:translateY(-2px);opacity:.9;}
  .btn.leeg{background:none;border:1px solid var(--line);color:var(--ink2);padding:13px 22px;}
  .btn.leeg:hover{border-color:var(--accent);color:var(--accent);transform:none;}
  .ring-blok{display:flex;align-items:center;gap:20px;justify-self:end;}
  .ring{transform:rotate(-90deg);flex:none;}
  .ring circle{fill:none;}
  .ring .baan{stroke:var(--line);}
  .ring .waarde{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);}
  .ring-blok .cijfer{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.02em;}
  .ring-blok .sub{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5;}

  /* ---- panelen ---- */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px;}
  .paneel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);animation:rise .85s ease both;}
  .paneel-kop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .paneel-kop .telling{font-size:11.5px;color:var(--accent);}
  .regel{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line);}
  .regel .tijd{font-family:var(--serif);font-size:15px;color:var(--ink2);}
  .regel .titel{font-size:13.5px;}
  .regel .plek{font-size:11.5px;color:var(--muted);}
  .regel[data-vak]{cursor:pointer;}
  .regel[data-vak]:hover .titel{color:var(--accent);}
  .regel.bezig{position:relative;}
  .regel.bezig .tijd{color:var(--accent);}
  .regel.bezig .titel{font-weight:600;}
  .regel.bezig::before{content:"";position:absolute;left:-14px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateY(-50%);}
  .regel.voorbij .tijd,.regel.voorbij .titel{opacity:.45;}
  .dl{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line);}
  .rooster-status{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .dl .titel{font-size:13.5px;}
  .dl .vak{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .dl .wanneer{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .dl .wanneer .dl-datum{font-size:11px;color:var(--muted);white-space:nowrap;text-transform:none;letter-spacing:0;margin:0;}
  .pil{font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:5px 11px;border-radius:999px;white-space:nowrap;background:var(--paper2);color:var(--ink2);}
  .pil.nu{background:var(--accent-soft);color:var(--accent);}
  .pil.rustig{background:var(--sage-soft);color:var(--sage);}

  /* ---- semester ---- */
  .sem-kop{display:flex;align-items:baseline;justify-content:space-between;margin:56px 0 20px;}
  .sem-kop h2{margin:0;font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;}
  .sem-kop h2 span{color:var(--muted);font-size:15px;font-family:var(--sans);}
  .sem-kop .stat{font-size:12.5px;color:var(--muted);}
  .mozaiek{display:grid;grid-template-columns:1.02fr .98fr;gap:20px;}
  .held{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:30px 32px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-height:290px;transition:transform .25s ease;animation:rise 1s ease both;}
  .held:hover{transform:translateY(-3px);}
  .held .bol{position:absolute;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;background:var(--accent-soft);}
  .held .binnen{position:relative;}
  .held .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  .held h3{margin:12px 0 0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.12;letter-spacing:-.015em;max-width:15ch;}
  .held .volgende{font-size:13.5px;color:var(--ink2);margin-top:14px;}
  .held .voet{position:relative;display:flex;align-items:center;gap:18px;margin-top:26px;}
  .held .voet .groot{font-size:15px;font-weight:500;}
  .held .voet .klein{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .tegels{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tegel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;transition:transform .22s ease,border-color .22s ease;animation:rise 1.05s ease both;}
  .tegel:hover{transform:translateY(-3px);border-color:var(--accent);}
  .tegel .vaknaam{font-family:var(--serif);font-size:17px;line-height:1.22;letter-spacing:-.01em;}
  .tegel .meta{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;color:var(--muted);}
  .tegel .meta b{font-weight:600;color:var(--accent);}
  .tegel .meta b.klaar{color:var(--sage);}
  .balk{height:4px;border-radius:99px;background:var(--paper2);margin-top:9px;overflow:hidden;}
  .balk i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s ease;}
  .balk i.klaar{background:var(--sage);}

  .archief{margin-top:20px;background:var(--paper2);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .archief-kop{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px;cursor:pointer;background:none;border:none;width:100%;text-align:left;color:inherit;}
  .archief-kop b{font-family:var(--serif);font-size:21px;font-weight:400;}
  .archief-kop .sub{font-size:12.5px;color:var(--muted);margin-left:14px;}
  .archief-kop .actie{font-size:12.5px;color:var(--accent);}
  .archief-lijst{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 26px 26px;animation:rise .4s ease both;}
  .archief-lijst[hidden]{display:none;}
  .mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .2s ease;}
  .mini:hover{border-color:var(--accent);}
  .mini span{font-size:13.5px;line-height:1.3;}
  .mini b{font-size:11px;color:var(--sage);font-weight:600;white-space:nowrap;}

  /* ---- notities ---- */
  .notities{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
  .notitie{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:6px 16px 16px 6px;padding:18px 20px;cursor:pointer;transition:transform .22s ease;}
  .notitie:hover{transform:translateY(-2px);}
  .notitie .vak{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .notitie .titel{font-family:var(--serif);font-size:16.5px;line-height:1.3;margin-top:9px;}
  .notitie .tekst{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.55;}

  footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:11.5px;color:var(--muted);}

  /* ---- detailpaneel ---- */
  .lade{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;}
  .lade[hidden]{display:none;}
  .sluier{position:absolute;inset:0;background:rgba(35,28,36,.34);backdrop-filter:blur(3px);animation:fadein .3s ease both;}
  .blad{position:relative;width:min(460px,92vw);height:100%;overflow:auto;background:var(--surface);border-left:1px solid var(--line);padding:34px 34px 44px;animation:rise .34s cubic-bezier(.2,.8,.2,1) both;}
  .blad-kop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .blad-kop .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  .blad-kop h3{margin:10px 0 0;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.14;letter-spacing:-.015em;}
  .blad-kop button{border:1px solid var(--line);background:none;color:var(--ink2);width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:15px;line-height:1;flex:none;}
  .blad-kop button:hover{border-color:var(--accent);color:var(--accent);}
  .blad-voortgang{display:flex;align-items:center;gap:14px;margin-top:22px;padding-bottom:20px;border-bottom:1px solid var(--line);}
  .blad-voortgang .balk{flex:1;height:5px;margin:0;}
  .blad-voortgang span{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .les{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
  .les-link{flex:1;color:inherit;text-decoration:none;}
  .les-link:hover .titel{color:var(--accent);}
  .les-link .meta{display:block;}
  .les .vink{cursor:pointer;padding:0;width:19px;height:19px;background:none;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;margin-top:2px;font-size:11px;color:var(--surface);transition:background .2s ease,border-color .2s ease;}
  .les.af .vink{background:var(--accent);border-color:var(--accent);}
  .les .titel{font-size:14px;line-height:1.4;display:block;}
  .les.af .titel{color:var(--muted);text-decoration:line-through;}
  .les .meta{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .leegmelding{margin-top:26px;background:var(--surface);padding:22px;border:1px dashed var(--line);border-radius:16px;text-align:center;}
  .leegmelding b{font-family:var(--serif);font-size:18px;font-weight:400;display:block;}
  .leegmelding span{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6;display:block;}

  @media (max-width:1040px){
    .wrap{padding:0 26px 64px;}
    .hero{gap:32px;}
    .mozaiek{grid-template-columns:1fr;}
    .tegels{grid-template-columns:1fr 1fr 1fr;}
    .archief-lijst{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:760px){
    .wrap{padding:0 18px 64px;}
    .top{flex-direction:column;align-items:stretch;gap:14px;}
    .tools{justify-content:space-between;}
    .zoek{width:100%;}
    .hero{grid-template-columns:1fr;gap:28px;padding:34px 0 26px;}
    .ring-blok{justify-self:start;}
    .duo,.tegels,.notities,.archief-lijst{grid-template-columns:1fr;}
    footer{flex-direction:column;}
  }

/* ============================================================
   LESPAGINA
   ============================================================ */
.lespagina .wrap{max-width:1240px;}
.les-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 0 0;}
.terug{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);}
.terug:hover{color:var(--accent);}
.kruimel{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:40px;}
.kruimel a{color:var(--muted);}
.kruimel a:hover{color:var(--accent);}
.les-titel{margin:14px 0 0;font-family:var(--serif);font-weight:300;font-size:clamp(30px,3.6vw,46px);line-height:1.08;letter-spacing:-.02em;max-width:26ch;text-wrap:pretty;}
.les-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px;}

/* voortgangsstrip */
.voortgang-strip{display:flex;align-items:center;gap:16px;margin-top:26px;padding-bottom:22px;border-bottom:1px solid var(--line);}
.voortgang-balk{flex:1;height:6px;border-radius:99px;background:var(--paper2);overflow:hidden;}
.voortgang-balk i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1);}
.voortgang-tekst{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}

/* tabbladen */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;}
.tab{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:10px 18px;font-size:13.5px;cursor:pointer;transition:border-color .2s ease,color .2s ease,background .2s ease;}
.tab:hover{border-color:var(--accent);color:var(--accent);}
.tab .tab-nr{font-family:var(--serif);font-size:13px;color:var(--muted);}
.tab.nu{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.tab.nu .tab-nr{color:var(--paper);opacity:.65;}
.tab.af:not(.nu){border-color:var(--accent);color:var(--accent);}
.tab .tab-vink{font-size:11px;}

/* body */
.les-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.45fr);gap:44px;margin-top:34px;align-items:start;}
.les-body.menu-uit{grid-template-columns:minmax(0,1fr);}
.les-body.menu-uit .zijkolom{display:none;}
.tab-kop{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--line);}
.tab-titel{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.015em;}
.af-knop{white-space:nowrap;}
.af-knop.af{background:var(--sage);}
.tab-nav{display:flex;justify-content:space-between;gap:14px;margin-top:40px;}
.tab-nav .btn:disabled{opacity:.3;cursor:default;}
.les-nav{display:flex;justify-content:space-between;gap:14px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);}
.les-nav a{font-size:13px;color:var(--muted);max-width:24ch;}
.les-nav a:hover{color:var(--accent);}
.les-nav .leeg{opacity:.35;pointer-events:none;}

/* zijkolom */
.zijkolom{position:sticky;top:24px;display:flex;flex-direction:column;gap:26px;}
.zij-blok{display:flex;flex-direction:column;gap:10px;}
.notitieveld{width:100%;min-height:170px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:13.5px;line-height:1.6;color:var(--ink);outline:none;}
.notitieveld:focus{border-color:var(--accent);}
.opslag{font-size:11px;color:var(--muted);}
.tablijst,#vaklijst{display:flex;flex-direction:column;}
.tablijst-rij,.vaklijst-rij{display:flex;align-items:baseline;gap:10px;padding:8px 0;font-size:13px;color:var(--ink2);background:none;border:none;text-align:left;cursor:pointer;font-family:inherit;}
.tablijst-rij:hover,.vaklijst-rij:hover{color:var(--accent);}
.tablijst-rij.nu,.vaklijst-rij.nu{color:var(--accent);font-weight:600;}
.vaklijst-rij.af{color:var(--muted);}
.mini-vink{width:16px;flex:none;font-size:11.5px;color:var(--muted);}
.tablijst-rij.nu .mini-vink,.vaklijst-rij.nu .mini-vink{color:var(--accent);}

/* ---- inhoud & blokken ---- */
.inhoud{font-size:15.5px;line-height:1.75;color:var(--ink2);}
.inhoud h2{font-family:var(--serif);font-weight:400;font-size:23px;color:var(--ink);margin:0 0 12px;letter-spacing:-.01em;}
.inhoud h3{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--ink);margin:0 0 8px;}
.inhoud p{margin:0 0 15px;max-width:70ch;text-wrap:pretty;}
.inhoud p:last-child{margin-bottom:0;}
.inhoud ul,.inhoud ol{margin:0 0 15px;padding-left:20px;max-width:70ch;}
.inhoud li{margin-bottom:7px;}
.inhoud code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:.9em;background:var(--paper2);padding:2px 5px;border-radius:4px;}
.inhoud strong{color:var(--ink);font-weight:600;}
.blok{position:relative;margin:0 0 34px;}
.blok:last-child{margin-bottom:0;}
.blok-kop{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}

.hint{font-size:11.5px;color:var(--muted);}
.noot{font-size:12.5px;color:var(--muted);font-style:italic;}

/* kaders */
.kader{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;}
.kader-kop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--paper2);}
.kader-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);}

.kader-body{padding:18px 20px;}
.kader-uitleg{border-left:3px solid var(--accent);}
.kader-uitleg .kader-label{color:var(--accent);}
.kader-waarschuwing{border-left:3px solid #B4635A;}
.kader-waarschuwing .kader-kop{background:color-mix(in oklab,#B4635A 10%,var(--surface));}
.kader-waarschuwing .kader-label{color:#B4635A;}
.kader-voorbeeld{border-left:3px solid var(--sage);}
.kader-voorbeeld .kader-kop{background:var(--sage-soft);}
.kader-voorbeeld .kader-label{color:var(--sage);}
.kader-slimmer{border-left:3px solid #A98545;border-style:dashed solid solid solid;}
.kader-slimmer .kader-kop{background:color-mix(in oklab,#A98545 12%,var(--surface));}
.kader-slimmer .kader-label{color:#A98545;}
.kader-hardop{border-left:3px solid var(--ink);background:var(--paper2);}
.kader-hardop .kader-kop{background:transparent;border-bottom:1px dashed var(--line);}
.hardop-lijst{margin:14px 0 0;padding-left:20px;font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--ink);}
.hardop-lijst li{margin-bottom:9px;}

/* leerdoelen */
.doelen{list-style:none;margin:0;padding:0;max-width:70ch;}
.doel{display:flex;align-items:flex-start;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);}
.doel.af span{color:var(--muted);text-decoration:line-through;}
.vink{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);background:none;display:grid;place-items:center;flex:none;margin-top:3px;font-size:11px;color:var(--surface);cursor:pointer;padding:0;transition:background .2s ease,border-color .2s ease;}
.doel.af .vink{background:var(--accent);border-color:var(--accent);}

/* citaat */
.citaat{margin:0;padding:22px 26px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 16px 16px 0;}
.citaat p{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.5;color:var(--ink);margin:0;}
.citaat footer{margin-top:12px;font-size:12.5px;color:var(--ink2);}

/* tabel */
.tabel-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
.inhoud table{width:100%;border-collapse:collapse;font-size:13.5px;}
.inhoud th,.inhoud td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top;}
.inhoud th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--paper2);}
.inhoud tbody tr:last-child td{border-bottom:none;}
.inhoud td:first-child{color:var(--ink);font-weight:500;}

/* stappen */
.stappen{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);}
.stap{border-bottom:1px solid var(--line);}
.stap:last-child{border-bottom:none;}
.stap summary{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;font-size:14.5px;color:var(--ink);list-style:none;}
.stap summary::-webkit-details-marker{display:none;}
.stap summary:hover{color:var(--accent);}
.stap-nr{width:24px;height:24px;border-radius:50%;background:var(--paper2);color:var(--muted);display:grid;place-items:center;font-size:12px;flex:none;font-family:var(--serif);}
.stap[open] .stap-nr{background:var(--accent);color:var(--surface);}
.stap-body{padding:0 20px 20px 58px;}

/* vergelijking */
.vergelijking{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.verg-kolom{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--surface);}
.verg-links{border-top:3px solid var(--accent);}
.verg-rechts{border-top:3px solid var(--sage);}
.verg-kolom ul{margin-bottom:0;}

/* flashcards */
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.kaart{position:relative;min-height:130px;cursor:pointer;perspective:900px;}
.kaart-vlak{position:absolute;inset:0;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:8px;backface-visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.kaart-voor{transform:rotateY(0deg);}
.kaart-achter{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent);}
.kaart.om .kaart-voor{transform:rotateY(-180deg);}
.kaart.om .kaart-achter{transform:rotateY(0deg);}
.kaart-rol{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.kaart-voor .kopieer{font-family:var(--serif);font-size:19px;line-height:1.25;color:var(--ink);}
.kaart-achter .kopieer{font-size:13px;line-height:1.55;color:var(--ink);}
.kopieer{cursor:copy;}
.kopieer:hover{text-decoration:underline dotted;text-underline-offset:3px;}

/* kernbegrippen */
.begrippen{display:flex;flex-wrap:wrap;gap:9px;}
.begrip{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font:inherit;font-size:13.5px;color:var(--ink);cursor:copy;display:inline-flex;align-items:baseline;gap:8px;transition:border-color .2s ease;}
.begrip:hover{border-color:var(--accent);color:var(--accent);}
.begrip-en{font-size:11.5px;color:var(--muted);font-style:italic;}
.tooltip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);width:max-content;max-width:280px;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.5;text-align:left;padding:11px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:5;}
.begrip:hover .tooltip{opacity:1;transform:translateX(-50%) translateY(0);}

/* oefening */
.oefening{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:16px;padding:20px;background:var(--surface);}
.oef-kop{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;}
.oef-veld{width:100%;min-height:96px;resize:vertical;margin-top:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:13.5px;line-height:1.6;color:var(--ink);outline:none;}
.oef-veld:focus{border-color:var(--accent);}
.model{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.model summary{cursor:pointer;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);list-style:none;}
.model summary::-webkit-details-marker{display:none;}
.model-body{margin-top:12px;padding:14px 16px;background:var(--paper2);border-radius:12px;font-size:14px;}

/* video */
.videoblok{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:22px 24px;background:var(--surface);}
.video-tekst h3{margin:8px 0 6px;}
.video-tekst p{margin:0;font-size:13.5px;}
.video-duur{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--muted);}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:18px;padding:24px;background:var(--surface);}
.quiz-score{font-family:var(--serif);font-size:17px;color:var(--muted);}
.quiz-score.actief{color:var(--accent);}
.qvraag{padding:18px 0;border-top:1px solid var(--line);}
.qvraag:first-of-type{border-top:none;padding-top:6px;}
.qtekst{display:flex;gap:12px;font-size:15px;color:var(--ink);margin:0 0 14px;}
.qnr{font-family:var(--serif);color:var(--muted);flex:none;}
.qopties{display:flex;flex-direction:column;gap:8px;}
.qoptie{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 16px;font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;transition:border-color .18s ease,background .18s ease;}
.qoptie:hover:enabled{border-color:var(--accent);color:var(--accent);}
.qoptie:disabled{cursor:default;}
.qoptie.goed{border-color:var(--sage);background:var(--sage-soft);color:var(--sage);font-weight:600;}
.qoptie.fout{border-color:#B4635A;background:color-mix(in oklab,#B4635A 12%,var(--surface));color:#B4635A;}
.quitleg{margin-top:12px;padding:14px 16px;background:var(--paper2);border-radius:12px;font-size:13.5px;line-height:1.6;}
.quitleg p{margin:0;}

/* preview volgende les */
.preview{display:block;border:1px dashed var(--line);border-radius:18px;padding:24px;background:var(--paper2);color:inherit;transition:border-color .2s ease,transform .2s ease;}
.preview:hover{border-color:var(--accent);transform:translateY(-2px);color:inherit;}
.preview h3{margin:10px 0 8px;font-size:22px;}
.preview p{margin:0 0 12px;font-size:14px;}
.preview ul{margin:0;}
.preview-actie{display:inline-block;margin-top:14px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}

/* bronnen */
.bronnen{font-size:13.5px;line-height:1.6;}
.bronnen li{margin-bottom:12px;}

/* melding bij kopiëren */
.melding{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:11px 20px;border-radius:999px;z-index:60;animation:rise .25s ease both;}
.melding[hidden]{display:none;}

@media (max-width:900px){
  .les-body{grid-template-columns:minmax(0,1fr);gap:28px;}

<script>
var LESSTOF = {};
/* Lesstof Intro to Safety & Security — inhoud per hoofdstuk.
   Boek: Bieder & Pettersen Gould (red.), The Coupling of Safety and Security (2020), open access.
   Laad dit bestand na lesstof.js. */

LESSTOF["intro-to-safety-security/h1"] = [
  {
    "id": "voor",
    "titel": "Voorbereiding",
    "blokken": [
      {
        "type": "leerdoelen",
        "items": [
          "Uitleggen waarom de vraag \"wat is het verschil tussen safety en security\" geen taalkundige maar een praktische vraag is",
          "De historische ontwikkeling van safety schetsen: van installatie, via organisatie, naar samenleving",
          "De historische ontwikkeling van security schetsen: van staatsveiligheid, via eigen kwetsbaarheid, naar 9/11 en daarna",
          "De twee academische onderscheidingsassen benoemen, toepassen, en uitleggen waarom ze soms verschillende antwoorden geven",
          "De drie invalshoeken van het boek noemen en per hoofdstuk aangeven waar het thuishoort",
          "Uitleggen waarom safety science en security science jonge en versnipperde vakgebieden zijn, en waarom dat gevolgen heeft voor jouw beroep",
          "De vier structurele knelpunten benoemen die ontstaan als organisaties safety en security tegelijk moeten leveren",
          "Beargumenteren waarom \"veilig genoeg\" geen technische maar een politieke vraag is"
        ]
      },
      {
        "type": "uitleg",
        "titel": "Even kennismaken met dit boek",
        "tekst": "Je leest een **bundel**, geen leerboek. Elf hoofdstukken van verschillende auteurs, die het onderling flink oneens zijn. Dat is geen slordigheid van de redactie, dat is de opzet.\n\nHet boek komt voort uit een **driedaagse workshop** van de denktank NeTWork, gehouden in juni 2018 in de abdij van Royaumont bij Parijs, gefinancierd door FonCSI, een Franse onderzoeksstichting voor industriële veiligheidscultuur. Onderzoekers uit verschillende landen en disciplines zaten daar drie dagen bij elkaar over één vraag: hoe verhouden safety en security zich tot elkaar?\n\nDe twee redacteuren zijn **Kenneth Pettersen Gould** (Universiteit van Stavanger, Noorwegen, achtergrond in maatschappelijke veiligheid en organisatieonderzoek) en **Corinne Bieder** (ENAC, de Franse burgerluchtvaartuniversiteit in Toulouse, achtergrond in luchtvaartveiligheid).\n\nDit eerste hoofdstuk is hun inleiding. Het doet twee dingen: het geeft je de **geschiedenis en de begrippen** die je nodig hebt om de rest te snappen, en het geeft je de **landkaart** van het boek."
      },
      {
        "type": "slimmer",
        "titel": "Waarom ik dit hoofdstuk belangrijker vind dan het lijkt",
        "tekst": "Inleidende hoofdstukken worden vaak overgeslagen. Doe dat hier niet, om één reden: dit is het enige hoofdstuk dat je uitlegt **waarom de rest elkaar tegenspreekt**.\n\nLeveson (h3) zegt dat het onderscheid tussen safety en security er nauwelijks toe doet. Brooks en Coole (h7) zeggen dat het twee compleet verschillende beroepen zijn met nauwelijks overlap. Dat lijkt op ruzie, maar het is het niet: ze kijken vanuit verschillende invalshoeken naar hetzelfde. Hoofdstuk 1 geeft je de drie invalshoeken waarmee je dat kunt zien.\n\nPraktisch: onthoud uit dit hoofdstuk vooral **drie dingen**. De tijdlijn, de twee onderscheidingsassen, en de drie invalshoeken. Alles wat je daarna leest hang je aan een van die drie."
      }
    ]
  },
  {
    "id": "kern",
    "titel": "Kernstof",
    "blokken": [
      {
        "type": "tekst",
        "titel": "Het probleem waarmee alles begint",
        "toetsstof": true,
        "tekst": "Ik begin met de zin waar het hele boek op staat. De redacteuren formuleren hem als een algemene maatschappelijke trend:\n\n**Hoe veiliger en beter beveiligd onze organisaties en instituties worden, hoe méér veiligheid we van ze eisen.**\n\nLees die zin twee keer, want hij is contra-intuïtief. Je zou verwachten dat de roep om veiligheid afneemt als het veiliger wordt. Het omgekeerde gebeurt.\n\nDe cijfers geven de eerste helft gelijk. Veel van de grootste bedreigingen voor gezondheid en veiligheid op het werk zijn teruggedrongen, zeker in Europa en Noord-Amerika. Maar tegelijkertijd is industriële veiligheid **breder** geworden. Er kwam veel meer aandacht voor de **nieuwe systemische risico’s** die moderne samenlevingen zelf voortbrengen, en voor het idee dat lokale kwetsbaarheden worden beïnvloed door **wereldwijde gebeurtenissen**.\n\nDat is de spanning die je door het hele boek terugziet: de verwachtingen stijgen sneller dan wat organisaties feitelijk kunnen leveren."
      },
      {
        "type": "voorbeeld",
        "titel": "Waarom stijgende eisen logisch zijn",
        "tekst": "Het klinkt onredelijk, maar er zit een gewone mechaniek achter. Denk aan een spoorwegovergang.\n\nZolang er elk jaar doden vallen bij onbewaakte overwegen, is een half beveiligde overweg een verbetering. Zodra alle overwegen slagbomen hebben en er nog maar zelden iets gebeurt, is elk incident opeens **groot nieuws**. Er wordt onderzoek geëist, een verantwoordelijke gezocht, en de norm gaat weer omhoog.\n\nDe verbetering zelf verlegt de meetlat. Precies daarom stapelen de eisen zich op terwijl de prestaties beter worden. En precies daarom, zegt hoofdstuk 1, moet je de vraag \"wat is veilig genoeg\" serieus stellen, want anders is het antwoord altijd \"meer\"."
      },
      {
        "type": "tekst",
        "titel": "1.1 Waar safety vandaan komt",
        "toetsstof": true,
        "tekst": "Nu de geschiedenis. Eerst safety, dan security. Je hebt beide sporen nodig om te begrijpen waarom ze zo moeilijk in elkaar te schuiven zijn.\n\nSafety is al lang een kernzorg van organisaties, vooral sinds de opkomst van **gevaarlijke technologieën en activiteiten**. In sectoren als energie, chemie, transport, water en zorg is safety een kernbegrip in **beleid, regelgeving én management** tegelijk. Dat drietal is belangrijk: safety zit niet alleen in de techniek, maar ook in de wet en in de manier waarop een organisatie is ingericht.\n\nDaardoor bestaan er inmiddels stevig ingeburgerde institutionele en managementstrategieën, samenwerkingsverbanden en praktijken rond het voorkómen van incidenten en ongevallen. Die effectief houden geldt als belangrijk voor de bescherming van gevaarlijke technologie, en wel om twee redenen:\n\n1. Ze zijn gebouwd op **eerdere incidenten**. Elke regel in een veiligheidsvoorschrift is meestal ooit betaald met schade.\n2. Ze vormen een **dynamisch maar kwetsbaar organisatorisch web van veiligheidsverdedigingen** (Macrae, 2014). Dat woord \"web\" is bewust gekozen: geen muur, maar een netwerk van elkaar deels overlappende verdedigingen dat voortdurend onderhoud vraagt."
      },
      {
        "type": "tekst",
        "titel": "De omslag in de jaren tachtig",
        "toetsstof": true,
        "tekst": "Vanaf de jaren tachtig gebeurde er iets belangrijks in het denken over veiligheid. Gevoed door beter begrip van hóé en waaróm ongelukken gebeuren, kwam er aandacht voor de vraag hoe ongevallen en rampen worden veroorzaakt door **maatschappelijke ontwikkelingen**, dus niet alleen door kapotte onderdelen of onoplettende werknemers.\n\nTwee namen die je moet kennen:\n\n**Barry Turner**, *Man-made Disasters* (1978). Rampen komen niet uit de lucht vallen; er gaat een lange incubatieperiode aan vooraf waarin signalen worden gemist of verkeerd geduid. Organisaties bouwen hun eigen ramp op, jarenlang, zonder het te merken.\n\n**Charles Perrow**, *Normal Accidents* (1984). Perrow stelt dat in bepaalde risicovolle systemen grote ongelukken **onvermijdelijk** zijn. Niet door pech of slordigheid, maar door de aard van het systeem zelf.\n\nDat argument werd invloedrijk en wakkerde de belangstelling aan voor twee dingen tegelijk: de **grenzen aan veiligheid**, en de **mogelijkheden van organisatorische competentie**. Dus enerzijds: hoe ver kunnen we komen? En anderzijds: wat kan een goed georganiseerde organisatie dan wél?\n\nDie tweede vraag is precies waar hoofdstuk 8 (La Porte) en hoofdstuk 9 (Schulman) op doorgaan, met hun werk over high reliability organizations."
      },
      {
        "type": "uitleg",
        "titel": "Waarom Perrow er hier toe doet",
        "tekst": "Perrow onderscheidt twee eigenschappen van systemen: **interactieve complexiteit** (onderdelen beïnvloeden elkaar op manieren die ontwerpers niet voorzagen) en **tight coupling** (er zit geen speling tussen de stappen, dus een verstoring plant zich meteen voort).\n\nZit een systeem hoog op beide, dan zijn ongelukken volgens Perrow normaal in de statistische zin: te verwachten, niet uitzonderlijk. Kerncentrales zijn zijn standaardvoorbeeld.\n\nJe hoeft Perrow niet in detail te kennen voor dit vak, maar wel dit: dat idee verandert de vraag. Niet \"hoe voorkomen we alle ongelukken\", maar **\"hoeveel risico accepteren we, en wie beslist dat\"**. Dat is de vraag waar hoofdstuk 1 in paragraaf 1.4 op uitkomt."
      },
      {
        "type": "tekst",
        "titel": "1.1 vervolg — waar security vandaan komt",
        "toetsstof": true,
        "tekst": "Security heeft een compleet andere afkomst, en dat verklaart veel van de latere wrijving.\n\n**Fase 1, tot circa 1989: security is staatsveiligheid.** Security was sterk verbonden met de staat en met bescherming tegen dreigingen van **buitenlandse staten**. Voor civiele industrieën was security alleen een thema voor zover die organisaties bijdroegen aan de **militaire verdedigingscapaciteit** van een staat. Een chemiefabriek deed dus wel aan safety, maar security was in principe iets van het leger en de inlichtingendiensten.\n\n**Fase 2, eind jaren tachtig: de blik draait naar binnen.** Toen de Koude Oorlog eindigde, verschoof de politieke aandacht naar vrede en internationale mensenrechten. En, belangrijker voor ons vak, er ontstond een groeiend bewustzijn van de **eigen kwetsbaarheid** van samenlevingen voor kwaadwillende daden als sabotage en terrorisme. De dreiging kwam niet langer per definitie van een andere staat.\n\n**Fase 3, tot 2001: nog steeds klein bier.** Tot de aanslagen in New York op 11 september 2001 vormden securitydreigingen een veel **kleiner deel** van de totale regelgevings- en managementscope dan andere gevaren, namelijk grote ongevallen en rampen. Dat is een cruciaal detail: security was er wel, maar het was ondergeschikt.\n\n**Fase 4, na 9/11: alles verandert.** Inmiddels zijn we veel vertrouwder geraakt met kwaadwillende aanvallen die zelfmoordoperaties kunnen omvatten. Mede door dat veranderde dreigingstype voelt het publiek een soort **vrij zwevende angst** (free-floating dread) die door terreuraanslagen wordt versterkt (LaPorte, 2006)."
      },
      {
        "type": "uitleg",
        "titel": "Wat \"free-floating dread\" precies betekent",
        "tekst": "Dit begrip is subtieler dan \"mensen zijn bang\". Gewone angst heeft een **object**: je bent bang voor de weg oversteken, en die angst verdwijnt als je aan de overkant staat.\n\nVrij zwevende angst heeft geen vast object. Het is een algemeen gevoel van dreiging dat zich aan wisselende dingen hecht: een rugzak in de metro, een menigte, een geluid. Het zakt niet weg als een specifiek gevaar verdwijnt, omdat het nooit aan dat gevaar vastzat.\n\nWaarom dat er voor jouw vak toe doet: beleid dat op zulke angst reageert kan **objectief succesvol** zijn en **subjectief mislukken**. Je verlaagt de kans op een aanslag, maar het gevoel blijft, dus de roep om maatregelen blijft ook. Dat is dezelfde mechaniek als de openingszin van het hoofdstuk, nu vanuit de securitykant."
      },
      {
        "type": "tekst",
        "titel": "Wat er na 9/11 institutioneel gebeurde",
        "toetsstof": true,
        "tekst": "De gevolgen van die verschuiving waren concreet en zichtbaar:\n\n- Er kwamen **nieuwe beleidsbegrippen** en nieuwe management- en organisatieperspectieven voor een veilige samenleving.\n- Het publiek riep om **betere voorbereiding**, met de nadruk op **preventie** in het bijzonder.\n- Er ontwikkelden zich nieuwe **eisen en verantwoordingsvormen** (accountabilities).\n\nHet standaardvoorbeeld dat de auteurs geven: in de Verenigde Staten werd de **Transportation Security Administration (TSA)** opgericht na het aannemen van de **Aviation and Transportation Security Act** in november 2001. De TSA valt nu onder het **Department of Homeland Security**. De auteurs verwijzen daarbij naar het 9/11 Commission Report uit 2004, en voegen toe dat er vergelijkbare ontwikkelingen zijn geweest in Europese landen.\n\nLet op wat hier feitelijk gebeurt: **securitytaken worden ondergebracht bij de burgerluchtvaart**, een sector die tot dat moment volledig was ingericht op safety. Dat is de geboorte van het snijvlak dat dit boek onderzoekt, en meteen ook de geboorte van het probleem."
      },
      {
        "type": "tekst",
        "titel": "Vier gevolgen van dat snijvlak",
        "toetsstof": true,
        "tekst": "De toenemende nadruk op security en de bijbehorende risicoreducerende maatregelen leidt tot een voor de hand liggend snijvlak tussen safety- en securitymanagement in gevaarlijke industrieën. De auteurs noemen vier concrete gevolgen. Ik zet ze op een rij, want dit is toetsbare stof:\n\n**1. Nieuwe categorie dreigingen.** Leiders en analisten moesten een compleet nieuwe categorie dreigingen begrijpen en meenemen in hun bestaande denkkaders.\n\n**2. Nieuwe samenwerkingen en domeinen.** Er ontstonden vormen van samenwerking en operationele domeinen die vóór 9/11 geen uitgangspunt waren van de bestaande strategieën en praktijken.\n\n**3. Twijfel aan het bestaande.** Er kwam twijfel over de effectiviteit van een flink deel van de bestaande benaderingen om gevaarlijke technologie te beschermen. Dat is een pijnlijk punt: het gaat niet alleen om iets toevoegen, maar om de vraag of wat er al stond wel deugt.\n\n**4. De interacties zijn niet vanzelfsprekend.** En dit is het meest onderschatte punt van het hele hoofdstuk: de interacties tussen safety en security blijken helemaal niet voor de hand te liggen, **vooral niet in normale situaties**. Er treden subtiele wederzijdse beïnvloedingen op. Pettersen en Bjørnskau (2015) lieten met veldonderzoek zien dat safety- en securitypraktijken elkaar in sommige gevallen zelfs **tegenwerken**."

        "type": "waarschuwing",

        "tekst": "Dit is een detail dat studenten steevast overslaan, en het is juist het interessantste.\n\nBij een **crisis** is het meestal wel duidelijk hoe safety en security zich verhouden: er is een aanslag, of er is een ongeluk, en iedereen weet wie waarover gaat.\n\nDe wrijving zit in de **gewone dinsdagochtend**. Een deur die volgens de brandveiligheid open moet en volgens de beveiliging dicht. Een logboek dat volgens safety openbaar moet zijn en volgens security niet. Een medewerker die volgens safety alles moet melden en volgens security niets mag doorvertellen.\n\nDaar botsen ze, elke dag, in het klein. En dáár is nauwelijks onderzoek naar, zoals paragraaf 1.4 zal toegeven."

      {
        "type": "voorbeeld",
        "titel": "Vier keer botsen in de praktijk",
        "tekst": "Om het concreet te maken, met voorbeelden in de geest van het hoofdstuk:\n\n**Nooduitgang.** Safety wil dat hij van binnenuit altijd opengaat. Security wil dat hij niet van buitenaf gebruikt kan worden en dat niemand ongezien naar buiten glipt.\n\n**Melden.** Safety wil dat je bijna-ongelukken meldt zonder straf, want zonder meldingen leer je niets. Security wil weten wie wat wanneer deed, en koppelt gedrag aan personen.\n\n**Publiceren.** Safetyonderzoek publiceert onderzoeksrapporten zodat de hele sector ervan leert. Securityonderzoek publiceert kwetsbaarheden juist niet, want dat is een handleiding voor de aanvaller.\n\n**Toegang.** Safety wil dat hulpverleners overal snel bij kunnen. Security wil dat zo min mogelijk mensen ergens bij kunnen.\n\nIn alle vier gevallen heeft **niemand ongelijk**. Dat is precies wat het zo lastig maakt: het is geen misverstand dat je met een goed gesprek oplost, het is een echte tegenstelling in doelen."

      {

        "titel": "De grote vraag die daaruit volgt",

        "tekst": "Uit die botsingen komt een heel praktische organisatievraag voort, en die keert in bijna elk hoofdstuk van dit boek terug:\n\n**Moeten organisaties twee aparte eenheden hebben voor safety en security, of moeten ze de twee samenvoegen?**\n\nDe auteurs constateren dat veel organisaties, industrieën en instituties daarover **aarzelen**. Dat woord is bewust gekozen. Ze zeggen niet dat het antwoord bekend is en dat men te traag is, ze zeggen dat er geen antwoord is.\n\nEn dat is meteen jouw beroepsvraag. Als jij straks als SSMS’er een advies schrijft over de inrichting van een veiligheidsorganisatie, is dit de vraag waar je op afgerekend wordt."

      {

        "titel": "Systemische risico’s en de politieke context",
        "toetsstof": true,
        "tekst": "Er speelt nog een derde beweging, naast de safetygeschiedenis en de securitygeschiedenis. Die is meer politiek-economisch, en het hoofdstuk noemt hem kort maar nadrukkelijk.\n\nVoor zowel safety als security worden gevaren en dreigingen tegenwoordig steeds vaker gedefinieerd als **systemische risico’s**: producten van de moderne samenleving zelf. Lokale kwetsbaarheden worden begrepen als beïnvloed door **wereldwijde gebeurtenissen en processen**, bijvoorbeeld binnen **digitalisering**.\n\nDeze ontwikkeling valt samen met een transformatie van zowel safety- als securitybeleid richting bredere velden en **gedeelde verantwoordelijkheden**, met aandacht voor maatschappelijke, civiele, homeland- en menselijke vraagstukken.\n\nEn die veranderingen moeten worden bezien in combinatie met de groei van **risicomanagement** als antwoord op beleidseisen. Die groei hangt weer samen met een breder patroon van **neoliberale invloed**, gekenmerkt door vergaande **deregulering, privatisering en uitbesteding**."

      {

        "titel": "Wat die neoliberale opmerking betekent voor jouw vak",
        "tekst": "Dit is een politieke observatie, en de auteurs werken hem niet uit. Maar hij is belangrijk genoeg om te vertalen, want je ziet het effect elke dag.\n\nDe redenering: als de overheid **dereguleert** (minder gedetailleerde regels), **privatiseert** (taken naar bedrijven) en **uitbesteedt** (werk naar onderaannemers), dan verdwijnt de directe sturing op veiligheid. Wat komt daarvoor in de plaats? **Risicomanagement**. Niet langer \"u moet X doen\", maar \"u moet aantonen dat u uw risico’s beheerst\".\n\nDrie gevolgen die je moet kunnen benoemen:\n\n1. Veiligheid wordt iets wat je **aantoont met documenten**, niet alleen iets wat je doet. Papier gaat meetellen als prestatie.\n2. Verantwoordelijkheid raakt **verspreid** over opdrachtgever, aannemer en onderaannemer. Bij een incident is de eerste vraag wie er eigenlijk over ging.\n3. Er ontstaat ruimte voor **verschil in interpretatie**, want de norm is niet meer voorgeschreven maar zelf in te vullen.\n\nDit verklaart ook waarom safety en security zo lastig te integreren zijn: ze worden vaak door verschillende partijen geleverd, met verschillende contracten. Bongiovanni (h6) laat dat voor luchthavens concreet zien."

      {

        "tekst": "De auteurs sluiten hun historische deel af met een scherpe formulering die je uit je hoofd mag kennen:\n\nWaar het grijze gebied tussen security en safety vroeger nog kon worden teruggebracht tot het probleem van **het definiëren van het verschil tussen een ongeluk en een criminele daad**, kunnen safety en security elkaar niet langer negeren. Niet in concepten, niet in beleid, en niet in managementpraktijk. En, voegen ze toe tussen haakjes: **als ze dat ooit al konden**.\n\nDat laatste zinsdeel is meer dan een stijlfiguur. Zonder dat zinsdeel zeg je: vroeger waren ze gescheiden, nu niet meer, dus we moeten iets nieuws bouwen. Mét dat zinsdeel zeg je: de scheiding was altijd al kunstmatig, en we konden er alleen mee wegkomen zolang het grijze gebied klein leek.\n\nDat is een veel radicalere claim, want dan is het probleem niet nieuw, alleen onze **vereenvoudiging** is opgehouden te werken."

        "tekst": "Nu de begrippen zelf. Het hoofdstuk begint voorzichtig: er is misschien **weinig verschil** tussen je *safe* voelen en je *secure* voelen (Ale, 2009). Maar als je aanneemt dat de concepten niet volledig analoog zijn, blijft heldere definiëring een uitdaging (Boholm e.a., 2016).\n\nTwee oorzaken worden genoemd.\n\n**Oorzaak 1: taal.** In veel talen bestaat maar één woord voor safety en security, anders dan in het Engels. Nederlands is daar een perfect voorbeeld van: wij zeggen \"veiligheid\" voor allebei, en moeten met \"beveiliging\", \"sociale veiligheid\" of gewoon de Engelse term improviseren.\n\n**Oorzaak 2: dubbel taalgebruik.** Er zijn veel academische definities aan de ene kant, en alledaags spraakgebruik aan de andere kant. Samen leveren die ambiguïteit op. \"Ik voel me hier niet veilig\" van een bewoner betekent iets anders dan \"veiligheid\" in een risicoanalyse, maar het is hetzelfde woord."

        "tekst": "De academische definities verwijzen hoofdzakelijk naar **twee typen onderscheid**. Dit is de eerste, en de bekendste.\n\n**Safety** richt zich op *hazards* en op **niet-intentionele of accidentele risico’s**.\n**Security** richt zich op **kwaadwillende dreigingen en intentionele risico’s**.\n\nDe kernvraag is dus: **deed iemand dit expres?**\n\nDeze as is intuïtief en werkt vaak goed. Een steiger die instort is safety, een aanslag op die steiger is security. Maar hij heeft twee zwakke plekken die je moet kennen:\n\n1. **Je weet het vaak niet.** Op het moment dat het misgaat, weet niemand of het opzet was. De brand woedt, de intentie stel je pas maanden later vast. Toch moet er nú gehandeld worden.\n2. **Het maakt voor de schade niet uit.** Een fabriek die explodeert richt dezelfde ravage aan, of het nu opzet was of niet. Dat is precies het argument waarmee **Leveson** in hoofdstuk 3 de hele as terzijde schuift."

        "tekst": "Casus: een medewerker van een waterzuivering zet uit frustratie over zijn ontslag een klep open. Er komt ongezuiverd water in de rivier.\n\n**As 1, intentionaliteit.** Hij deed het expres. Dus: **security**.\n\n**As 2, richting van de schade.** Het systeem schaadt de omgeving, de rivier. Dus: **safety**.\n\nTwee assen, twee verschillende antwoorden. Dat is geen fout in je redenering; dit is exact het grijze gebied waar het boek over gaat. Merk bovendien op dat de dader **binnen** het systeem staat, terwijl as 2 security definieert als iets wat van buiten komt.\n\nHoe je hier professioneel mee omgaat: je kiest niet stiekem één as en doet alsof het duidelijk is. Je **benoemt** dat de assen uiteenlopen, je legt uit welke gevolgen dat heeft (wie is verantwoordelijk, wie onderzoekt het, welke maatregel volgt), en pas dan geef je je advies. Dat verschil tussen \"een mening geven\" en \"een afweging tonen\" is precies het verschil tussen mbo- en hbo-niveau."

        "tekst": "Ondanks alle pogingen om het onderscheid te verfijnen, keert er volgens de auteurs één vraag steeds terug: moet je de twee **überhaupt onderscheiden**, of moet je gewoon zo goed mogelijk alle gevaren managen, of die ons nu onveilig of onbeveiligd doen voelen? Die vraag komt van **Young en Leveson (2014)**, en Leveson werkt dat standpunt in hoofdstuk 3 volledig uit.\n\nEen centraal concept om beide te bereiken is **risicomanagement**. Zie Blokland en Reniers in hoofdstuk 2, en de redacteuren zelf in hoofdstuk 11.\n\nMaar, waarschuwen de auteurs meteen, ook daar is het niet opgelost. Er is veel verwarring over:\n- wat je van risicoanalyse mag **verwachten** (Short, 1992),\n- **hoe** je die uitvoert,\n- en of die voor safety en security wel **hetzelfde** is (Jore, 2019).\n\nMerk op hoe dit hoofdstuk telkens dezelfde vorm heeft: hier is een voorgestelde oplossing, en hier is waarom die de zaak niet afsluit. Dat is geen zwakte van het boek, dat is de stand van het vakgebied."

      {

        "titel": "Hoe wetenschap en techniek de kloof juist vergroten",

        "tekst": "Je zou verwachten dat meer wetenschap en betere techniek de begrippen dichter bij elkaar brengen. Het tegendeel gebeurt vaak. De conceptuele verschillen tussen safety en security zijn in veel contexten **verder uitvergroot** door wetenschap en technologie. Het voorbeeld dat de auteurs uitwerken is de luchthaven.\n\nIn de dagelijkse operatie hebben securityscreeners en safetypersoneel:\n- een **andere opleiding**,\n- **andere technologie**,\n- en ze **werken op volledig verschillende manieren**.\n\nDaar komt bij dat de verschillende **regelgevende kaders** en de aard van sommige **contracten** op luchthavens die scheiding nog verder versterken (Bongiovanni, 2016).\n\nDenk even door wat dat betekent. Twee groepen mensen op hetzelfde terrein, met hetzelfde overkoepelende doel, die elkaars opleiding niet hebben gevolgd, elkaars apparatuur niet kunnen bedienen, onder verschillende regels vallen en soms voor verschillende werkgevers werken. Dat integreer je niet met een gezamenlijke nieuwsbrief."

      {
        "type": "tekst",

        "tekst": "Hier komt de zin die volgens mij het meest telt voor jouw toekomstige beroep.\n\nHoe gescheiden de werelden ook zijn, gedrag van individuele medewerkers of organisaties om zich tegen dreigingen en gevaren te beschermen vereist **beslissingen zonder dat is uitgemaakt of het om safety of om security gaat**.\n\nEn wie neemt die beslissingen? De auteurs zijn expliciet: **\"gewone werknemers\"**, managers, HSE-professionals, securityfunctionarissen en andere professionals.\n\nDat is de kloof tussen theorie en praktijk in dit vakgebied. Academici debatteren over de juiste definitie; de beveiliger bij de deur moet nu beslissen of hij die deur openzet.\n\nDe consequentie voor jou: een advies dat pas werkt nadat iemand het onderscheid correct heeft geclassificeerd, is geen bruikbaar advies. Het moet werken in de situatie waarin dat onderscheid niet vaststaat."

      {
        "type": "tekst",
        "titel": "De drie invalshoeken van het boek",
        "toetsstof": true,
        "tekst": "Hoe vaag de scheidslijnen ook zijn, de bijdragen in dit boek laten zien hoe safety en security samenkomen vanuit verschillende wetenschappelijke posities en contexten. De redacteuren onderscheiden **drie invalshoeken**, en je moet weten welk hoofdstuk waar zit.\n\n**1. Conceptueel** — wat zíjn deze dingen eigenlijk, en welke woorden gebruiken we?\nBlokland & Reniers (h2), Jore (h5)\n\n**2. Technisch en methodologisch** — hoe analyseren, ontwerpen en meten we?\nLeveson (h3), Wipf (h4), Bongiovanni (h6)\n\n**3. Management en praktijk** — wie doet wat, in welke organisatie, en waar botst dat?\nBrooks & Coole (h7), La Porte (h8), Boustras (h10), Schulman (h9)\n\nDe hoofdstukken laten zien dat safety én security doen een vrij **generiek kenmerk** van organisaties is, en voor veel organisaties zelfs onlosmakelijk verbonden met hun bestaan. Maar als **beroepsvelden** hebben ze zich verschillend ontwikkeld, ondersteund door heel aparte wetenschappelijke en technologische velden.\n\nEn nog een nuance: sommige delen van de professionele safety- en securitypraktijk steunen op zeer gespecialiseerde en rigoureuze kennis, terwijl andere delen zijn **geroutiniseerd door conventie, regel of wet** (Short, 1992). Daarom is er, naast technische kennis en methoden, **empirische studie** nodig van de organisaties en systemen waarin safety en security zich ontwikkelen en op elkaar inwerken. Dat is precies wat La Porte in hoofdstuk 8 bepleit."

        "titel": "De hoofdstuksamenvattingen, uitgebreid",

        "tekst": "Hieronder wat de redacteuren zelf per hoofdstuk aankondigen. Lees dit nu vluchtig, en kom er na elk hoofdstuk op terug. Dan zie je steeds waar je bent op de kaart.\n\n**Hoofdstuk 2 — Blokland & Reniers.** Nemen een risicoperspectief en richten zich op wat safety en security verbindt en onderscheidt in situaties met onzekerheid over effecten op individuele, organisatorische of maatschappelijke doelstellingen. Voor risicoanalysedoeleinden schetsen zij safety en security grotendeels op dezelfde manier, maar zij beargumenteren ook verschillen die te maken hebben met effecten, doelstellingen en onzekerheid.\n\n**Hoofdstuk 3 — Leveson.** Laat zien hoe methoden uit system safety engineering kunnen worden ontwikkeld zodat ze zowel safety- als securityscenario’s omvatten. De aanpak erkent dat **ontwerpfouten niet vóór gebruik kunnen worden geëlimineerd**, en dat de complexiteit van veel systemen vraagt om nieuwe en meer omvattende causaliteitsmodellen. Het hoofdstuk laat zien hoe engineeringgereedschappen op basis van systeemtheorie safety en security geïntegreerd kunnen behandelen.\n\n**Hoofdstuk 4 — Wipf.** Gebruikt op basis van een empirische casus uit lichte helikopteroperaties een **speltheoretische benadering** om safety- en securitykwesties in combinatie te beoordelen. Het hoofdstuk illustreert de overeenkomsten en verschillen tussen beoordelingstechnieken.\n\n**Hoofdstuk 5 — Jore.** Erkent dat security science zich richting **zachtere maatregelen** beweegt, en betoogt dat security culture een veelbelovend concept is voor organisaties omdat het security tot prioriteit en gedeelde verantwoordelijkheid kan maken. Ze vergelijkt het met het veel breder toegepaste safety culture. De deugdelijkheid van het concept wordt besproken aan de hand van een onderzoeksrapport over een terroristische aanslag op een internationaal geleide Algerijnse oliefaciliteit, en de discussie wordt gestructureerd met criteria voor **conceptuele adequaatheid**.\n\n**Hoofdstuk 6 — Bongiovanni.** Is methodegericht en neemt een **eindgebruikersperspectief** op safety en security. Met focus op de luchthavensecurityomgeving, en securityscreening in het bijzonder, laat hij de mogelijke voordelen zien van verder kijken dan de juridische en managementperspectieven die zowel safety- als securitymanagement lijken te domineren. Zijn stelling: zo kunnen organisaties minder middelen besteden aan de **\"eeuwige spelbrekers\"** van loss prevention en meer waarde creëren voor gebruikers.\n\n**Hoofdstuk 7 — Brooks & Coole.** Legt uit hoe safety en security, hoewel ze een overkoepelende drijfveer van maatschappelijk welzijn delen, **uiteenlopen als afzonderlijke beroepen**. Zij beschouwen security binnen de context van corporate security en safety binnen de context van occupational health and safety, en concluderen dat er, bekeken binnen hun beroepen en de ondersteunende professionele kennisdomeinen, **beperkte synergie** is.\n\n**Hoofdstuk 8 — La Porte.** Stelt de vraag welke organisatieontwerp- en operationele puzzels ontstaan wanneer van organisaties en publieke instellingen tegelijk \"veiligheid in de operatie\" en \"beveiliging tegen externe dreiging\" wordt geëist, terwijl hun kerntechnologieën groeien in schaal en complexiteit. Voortbouwend op ervaring uit een **veldstudie van grootschalige technische organisaties** formuleert het hoofdstuk vragen die opkomen als safety en security gemengde operationele uitdagingen worden, en schetst het een gids voor verder empirisch onderzoek. Ook behandelt het de strategische implicaties voor de **hoogste leiding**, die zowel met externe dreigingen als met de toenemende sociale complexiteit van de operatie te maken krijgt.\n\n**Hoofdstuk 9 — Schulman.** Richt zich, voortbouwend op eerder onderzoek naar **high-reliability management**, op de managementuitdaging van de convergentie van safety en security. Hij bespreekt hoe high reliability kan functioneren als gemeenschappelijk kader voor safety en security, en welke uitdagingen het meebrengt om beide onder één groter managementkader te brengen.\n\n**Hoofdstuk 10 — Boustras.** Verkent safety en security vanuit het perspectief van de **werkplek**, en betoogt dat opkomende risico’s en nieuwe drijvers zorgen voor nieuwe aandachtsgebieden op het snijvlak. Omdat de werkgerelateerde gevolgen en de directe economische impact voor organisaties **minder zichtbaar** zijn, worden overheidsinstanties en regeldruk meer de ruggengraat, met toenemende eisen aan de werkplek."

        "tekst": "De term hazard wordt soms losjes gebruikt voor dingen buiten de systeemgrens, zoals slecht weer of hoge bergen in de luchtvaart. Volgens Leveson is dat onjuist.\n\nDe hazard is **niet** het slechte weer of de berg. De hazard is:\n- het vliegtuig dat negatief wordt beïnvloed door het slechte weer, of\n- het vliegtuig dat de minimale afstand tot de berg schendt.\n\nHet weer en de berg kunnen we niet elimineren. Het ontwerp en de bediening van ons systeem kunnen we wél zo inrichten dat de dreiging die ervan uitgaat verdwijnt. Constraints of controls kunnen dan bestaan uit ontwerpen dat het vliegtuig het weer kan doorstaan, of uit operationele regels om weg te blijven bij het weer of de berg.\n\nHet doel van ontwerpers en gebruikers is dus: de systeemhazards identificeren, gedefinieerd als vallend binnen hun eigen controle, en die elimineren of beheersen in ontwerp en operatie."

        "tekst": "Er bestaat veel verwarring tussen safety en betrouwbaarheid (reliability), terwijl het twee heel verschillende eigenschappen zijn.\n\nToen systemen relatief eenvoudig waren, uitsluitend bestonden uit elektromechanische onderdelen en uitputtend geanalyseerd of getest konden worden, konden ontwerpfouten die tot verlies leiden grotendeels worden opgespoord en verwijderd **voordat** het systeem in gebruik ging. Wat overbleef als oorzaak van verlies waren vooral **fysieke storingen**.\n\nUit dat tijdperk, de jaren zeventig en eerder, stammen de traditionele hazardanalysetechnieken:\n- **fault tree analysis (FTA)**\n- **HAZOP**, in de chemische industrie\n- **event tree analysis**, in de nucleaire industrie\n- **FMECA**, failure modes and criticality analysis\n\nVoor die relatief eenvoudige systemen was de betrouwbaarheid van componenten een handige **proxy** voor safety, omdat de meeste ongevallen voortkwamen uit componentfalen. De technieken waren dan ook ontworpen om componentstoringen te vinden die tot een verlies kunnen leiden."

      { type: 'tekst', titel: 'Waar het vak over gaat', toetsstof: true,
        tekst: 'Het vertrekpunt is een observatie over je toekomstige beroep: de meeste safety- en securitymanagementprofessionals besteden een groot deel van hun tijd aan **werken in en omgaan met bureaucratieën**. De handleiding definieert die als min of meer permanente, hiërarchisch gestructureerde, doelgerichte organisaties die zijn ontworpen om gecentraliseerde besluiten, oftewel "policies", te laten uitvoeren door personeel op lagere niveaus.\n\n**Eerste deel van de cursus.** Het functioneren van publieke, dus gouvernementele bureaucratieën: brandweerkorpsen, scholen, ministeries, legers, politie, inlichtingendiensten en gemeenten. Welke soorten mensen bevolken de bureaucratische wereld, en in welke politieke context moeten zij opereren? Doel is een realistisch beeld van wat overheidsinstanties feitelijk doen en waarom, met aandacht voor verschillen in bestuurssystemen en bureaucratieën wereldwijd.\n\n**Tweede deel van de cursus.** Beleid en besluitvorming in organisaties. Dat kan gaan om publieke en private organisaties, dus overheden en bedrijven, maar ook om mengvormen zoals hybride en maatschappelijke organisaties. Aan de hand van analytisch te onderscheiden fasen in het beleidsproces en op basis van wetenschappelijke literatuur krijg je inzicht in de uitdagingen, problemen en dilemma\u2019s waar beleidsmakers in hun besluitvorming mee te maken hebben, en in hoe zij daar in de praktijk mee omgaan.\n\nAan het eind ken je een aantal grote obstakels en **pathologieën** die het ideaal van een rationele beleidspraktijk in de weg staan.' },

        tekst: 'Dit vak geldt als een van de essentiële academische **"moederdisciplines"** van safety and security studies. Het combineert sociologie en politicologie.\n\nSociologie gaat vooral over de manier waarop mensen samenleven en met elkaar omgaan in samenlevingen. Politiek is, in de definitie van **Laswell** die de handleiding aanhaalt, de vraag "wie krijgt wat, wanneer en hoe".\n\nPolitieke instituties en politici beslissen ook over de regels die safety en security direct beïnvloeden: van het stellen van normen en het handhaven van naleving, via misdaad- en terrorismebestrijding en het surveilleren van burgers, tot het voeren van oorlog. Die processen verschillen sterk per land, vaak afhankelijk van het **regimetype** en van de ideologische en waardeoriëntatie van de regeringsmeerderheid.\n\n**Eerste deel.** Sociologische perspectieven, waarmee je je eigen ervaringen leert plaatsen binnen de grotere schaal van de samenleving, gekenmerkt door sociale structuur en systeem. Je leert vertrouwde situaties in een nieuw licht zien en nieuwe betekenis vinden in oude en nieuwe manieren van doen. Er zijn drie hoofdthema\u2019s: **identiteit, sociale orde en stratificatie**. Elk van die drie levert een eigen vraagstuk op voor safety- en securitymanagement.\n\n**Tweede deel.** De basis van de politicologie: verschillende regimetypen (democratisch, hybride, autoritair, totalitair), hun instituties en functioneren, regimeverandering, politieke ideologieën, en factoren die bepalen hoe politiek uitpakt, zoals staten, naties, identiteit, sociale druk en buitenlandse invloed. Voorbeelden komen uit actuele politieke gebeurtenissen of uit bekende historische casussen.' },

        tekst: 'Elk onderzoek moet een helder doel hebben, dat vastlegt waar het onderzoek over gaat en op welke manieren.\n\nIn dit vak maak je kennis met onderzoeksmethoden als **analytische gereedschapskist** voor toegepast onderzoek, en met de gangbare toepassing daarvan binnen safety en security. Je raakt vertrouwd met basisprincipes en concepten van toegepast onderzoek, en met hun onderlinge verbanden en toepassingen. Je leert ook je eigen **applied research design** formuleren, inclusief het afbakenen van onderzoeksproblemen, het ontwikkelen van adequate onderzoeksdoelstellingen, hoofdvragen, deelvragen, en het identificeren van mogelijke onderzoeksbeperkingen.\n\nDeze vaardigheden zijn essentieel, niet alleen binnen SSMS maar in elke toegepaste onderzoeksomgeving. DRM is de **eerste in een reeks vakken van de Research Methods-track**, die je de analytische en onderzoeksvaardigheden bijbrengt die je nodig hebt voor opdrachten, rapporten en je bachelorscriptie, en voor het oplossen van praktische problemen in je latere werk.' },

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];

}
function rijkeTekst(s){
  var t = esc(s || '');

       .replace(/`([^`]+)`/g, '<code>$1</code>');

}

      }).join('') + '</div>';
  },
  bronnen: function(b){
    return '<h2>' + esc(b.titel || 'Bronnen') + '</h2><ol class="bronnen">' +
      (b.items || []).map(function(s){
        return '<li><span class="kopieer" data-kopieer="' + esc(s.apa || s.titel) + '">' + esc(s.apa || s.titel) + '</span>' +
          (s.url ? ' <a href="' + esc(s.url) + '" target="_blank" rel="noopener">openen</a>' : '') + '</li>';
      }).join('') + '</ol><p class="noot">Klik op een bron om de APA-verwijzing te kopiëren.</p>';
  },
  preview: function(b){
    return '<a class="preview" href="#" data-naarles="' + esc(b.lesId || '') + '"><span class="kader-label">Volgende les</span><h3>' + esc(b.titel) + '</h3>' +
      (b.tekst ? '<p>' + esc(b.tekst) + '</p>' : '') +
      (b.punten && b.punten.length ? '<ul>' + b.punten.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') +
      '<span class="preview-actie">Vooruitkijken &rarr;</span></a>';
  }
};

function blokHtml(b, ctx){
  var f = BLOKKEN[b.type];
  if (!f) return '<div class="blok">Onbekend bloktype: ' + esc(b.type) + '</div>';
  var stof = b.toetsstof ? '<span class="stof-vlag" title="Dit is toetsstof">toetsstof</span>' : '';
  return '<section class="blok blok-' + esc(b.type) + '">' + stof + f(b, ctx || {}) + '</section>';
}

/* ---------------- pagina ---------------- */
var lesId = 'h1', actief = 0, onderdelen = [];

function isInfo(id){ return id.indexOf('info-') === 0; }
function sleutelVan(id){
  return isInfo(id) ? 'info/' + id.slice(5) : 'intro-to-safety-security/' + id;
}
function beschikbaar(id){ return !!LESSTOF[sleutelVan(id)]; }
function haalOnderdelen(id){
  return LESSTOF[sleutelVan(id)] || [
    { id: 'leeg', titel: 'Nog niet gevuld', blokken: [
      { type: 'uitleg', titel: 'Dit hoofdstuk komt nog',
        tekst: 'De stof van dit hoofdstuk is nog niet toegevoegd. Gebruik dit tabblad zolang als schrijfblok in je aantekening rechts.' }
    ]}
  ];
}
function basis(){ return 'ssms-' + sleutelVan(lesId).replace('/', '-'); }
function tabSleutel(i){ return basis() + '-tab-' + onderdelen[i].id; }
function tabAf(i){ return lokaalWaar(tabSleutel(i)); }

function toonLeslijst(){
  document.getElementById('leslijst').innerHTML = LESSEN_LIJST.map(function(l, i){
    var klaar = beschikbaar(l.id);
    return '<button class="vaklijst-rij' + (l.id === lesId ? ' nu' : '') + '" data-les="' + l.id + '">' +
      '<span class="mini-vink">' + (i + 1) + '</span><span>' + esc(l.titel) + (klaar ? '' : ' <em style="opacity:.5">volgt</em>') + '</span></button>';
  }).join('');
  var il = document.getElementById('infolijst');
  if (il) il.innerHTML = INFO_LIJST.map(function(l, i){
    var id = 'info-' + l.id;
    return '<button class="vaklijst-rij' + (id === lesId ? ' nu' : '') + '" data-les="' + id + '">' +
      '<span class="mini-vink">' + (i + 1) + '</span><span>' + esc(l.titel) + '</span></button>';
  }).join('');
}

function toonTabs(){
  document.getElementById('tabs').innerHTML = onderdelen.map(function(o, i){
    return '<button class="tab' + (i === actief ? ' nu' : '') + (tabAf(i) ? ' af' : '') + '" data-tab="' + i + '">' +
      '<span class="tab-nr">' + (i + 1) + '</span>' + esc(o.titel) + (tabAf(i) ? '<span class="tab-vink">✓</span>' : '') + '</button>';
  }).join('');
  var af = 0; for (var i = 0; i < onderdelen.length; i++) if (tabAf(i)) af++;
  var pct = Math.round(af / onderdelen.length * 100);
  document.getElementById('lesBalk').style.width = pct + '%';
  document.getElementById('lesVoortgang').textContent = af + ' van ' + onderdelen.length + ' onderdelen afgerond · ' + pct + '%';
}

function notitieSleutel(){ return 'ssms-notitie-' + sleutelVan(lesId).replace('/', '-') + '-' + onderdelen[actief].id; }

function toonTab(){
  var o = onderdelen[actief];
  var ctx = { sleutel: basis() + '-' + o.id };
  document.getElementById('tabLabel').textContent = 'Onderdeel ' + (actief + 1) + ' van ' + onderdelen.length;
  document.getElementById('tabTitel').textContent = o.titel;
  document.getElementById('inhoud').innerHTML = o.blokken.map(function(b){ return blokHtml(b, ctx); }).join('');
  document.getElementById('notitieTab').textContent = o.titel.toLowerCase();

  var knop = document.getElementById('tabAf'), af = tabAf(actief);
  knop.textContent = af ? '✓ Afgerond' : 'Onderdeel afvinken';
  knop.className = af ? 'btn af-knop af' : 'btn af-knop';
  document.getElementById('tabVorige').disabled = actief === 0;
  document.getElementById('tabVolgende').textContent = actief === onderdelen.length - 1
    ? (isInfo(lesId) ? 'Volgende onderwerp →' : 'Volgende hoofdstuk →') : 'Volgende →';

  try { document.getElementById('notitie').value = localStorage.getItem(notitieSleutel()) || ''; } catch(e){}
  document.querySelectorAll('.oef-veld').forEach(function(v){
    var k = basis() + '-' + o.id + '-oef-' + (v.getAttribute('data-oef') || '0');
    try { v.value = localStorage.getItem(k) || ''; } catch(e){}
    v.addEventListener('input', function(){ try { localStorage.setItem(k, v.value); } catch(e){} });
  });
  toonTabs();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function naarLes(id){
  lesId = id; actief = 0;
  onderdelen = haalOnderdelen(id);
  var info = isInfo(id);
  var l = info
    ? INFO_LIJST.filter(function(x){ return 'info-' + x.id === id; })[0]
    : LESSEN_LIJST.filter(function(x){ return x.id === id; })[0];
  document.getElementById('titel').textContent = l ? l.titel : id;
  document.getElementById('kruimel').innerHTML = info
    ? 'Semester 1 &middot; modulehandleiding 2026-2027'
    : 'Semester 1 &middot; Intro to Safety &amp; Security &middot; The Coupling of Safety and Security';
  document.getElementById('meta').innerHTML = (info
      ? '<span class="pil">Studiegids</span>'
      : '<span class="pil">Hoofdstuk ' + id.slice(1) + ' van 11</span>') +
    '<span class="pil rustig">' + onderdelen.length + ' onderdelen</span>' +
    (beschikbaar(id) ? '' : '<span class="pil">stof volgt nog</span>');
  try { localStorage.setItem('ssms-intro-laatst', id); } catch(e){}
  toonLeslijst();
  toonTab();
}

document.addEventListener('click', function(e){
  var t = e.target;
  var kop = t.closest('[data-kopieer]');
  if (kop) {
    e.preventDefault();
    var tekst = kop.getAttribute('data-kopieer');
    if (navigator.clipboard) navigator.clipboard.writeText(tekst);
    var m = document.getElementById('melding');
    m.textContent = 'Gekopieerd'; m.hidden = false;
    setTimeout(function(){ m.hidden = true; }, 1500);
    return;
  }
  var les = t.closest('[data-les]');
  if (les) { naarLes(les.getAttribute('data-les')); return; }
  var pv = t.closest('[data-naarles]');
  if (pv) { e.preventDefault(); var id = pv.getAttribute('data-naarles'); if (id) naarLes(id); return; }
  var tab = t.closest('[data-tab]');
  if (tab) { actief = +tab.getAttribute('data-tab'); toonTab(); return; }
  var doel = t.closest('[data-vinkdoel]');
  if (doel) {
    var k = doel.getAttribute('data-vinkdoel');
    lokaalZet(k, !lokaalWaar(k));
    doel.textContent = lokaalWaar(k) ? '✓' : '';
    doel.closest('.doel').classList.toggle('af', lokaalWaar(k));
    return;
  }
  var optie = t.closest('.qoptie');
  if (optie) {
    var vraag = optie.closest('.qvraag');
    if (vraag.classList.contains('beantwoord')) return;
    var juist = +vraag.getAttribute('data-juist'), gekozen = +optie.getAttribute('data-optie');
    vraag.classList.add('beantwoord');
    vraag.querySelectorAll('.qoptie').forEach(function(o, i){
      if (i === juist) o.classList.add('goed'); else if (i === gekozen) o.classList.add('fout');
      o.disabled = true;
    });
    vraag.querySelector('.quitleg').hidden = false;
    if (gekozen === juist) vraag.classList.add('was-goed');
    var quiz = vraag.closest('.quiz');
    var score = quiz.querySelector('[data-score]');
    score.textContent = quiz.querySelectorAll('.was-goed').length + ' / ' + quiz.querySelectorAll('.qvraag').length;
    score.classList.add('actief');
  }
});

var timer;
document.getElementById('notitie').addEventListener('input', function(){
  var veld = this, melding = document.getElementById('opslag');
  clearTimeout(timer);
  melding.textContent = 'bewaren…';
  timer = setTimeout(function(){
    try { localStorage.setItem(notitieSleutel(), veld.value); } catch(e){}
    melding.textContent = 'bewaard';
  }, 400);
});

document.getElementById('tabAf').addEventListener('click', function(){
  var k = tabSleutel(actief);
  lokaalZet(k, !lokaalWaar(k));
  toonTab();
  if (lokaalWaar(k) && actief < onderdelen.length - 1) { actief++; toonTab(); }
});
document.getElementById('tabVorige').addEventListener('click', function(){ if (actief > 0) { actief--; toonTab(); } });
document.getElementById('tabVolgende').addEventListener('click', function(){
  if (actief < onderdelen.length - 1) { actief++; toonTab(); return; }
  var lijst = isInfo(lesId)
    ? INFO_LIJST.map(function(x){ return 'info-' + x.id; })
    : LESSEN_LIJST.map(function(x){ return x.id; });
  var i = lijst.indexOf(lesId);
  if (i > -1 && lijst[i + 1]) naarLes(lijst[i + 1]);
});

document.getElementById('modus').addEventListener('click', function(){
  var donker = document.documentElement.getAttribute('data-mode') === 'dark';
  document.documentElement.setAttribute('data-mode', donker ? 'light' : 'dark');
  try { localStorage.setItem('ssms-modus', donker ? 'light' : 'dark'); } catch(e){}
});
try { if (localStorage.getItem('ssms-modus') === 'dark') document.documentElement.setAttribute('data-mode', 'dark'); } catch(e){}

document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && actief < onderdelen.length - 1) { actief++; toonTab(); }
  if (e.key === 'ArrowLeft' && actief > 0) { actief--; toonTab(); }
});

var start = 'h1';
try { start = localStorage.getItem('ssms-intro-laatst') || 'h1'; } catch(e){}
naarLes(start);

</script>
</body>
</html>
