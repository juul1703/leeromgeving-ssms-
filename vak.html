<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vak · SSMS Leeromgeving</title>
<meta name="theme-color" content="#F6F2EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="lespagina">
<div class="wrap">
  <div class="les-top">
    <a class="terug" href="index.html">&larr; Terug naar overzicht</a>
    <div class="tools">
      <button class="rond" id="modus" aria-label="Wissel licht en donker">☾</button>
    </div>
  </div>

  <div class="vak-hero">
    <div class="kicker" id="vakKicker">Semester 1</div>
    <h1 id="vakTitel">Vak laden…</h1>
    <div class="les-meta" id="vakMeta"></div>
  </div>

  <div class="voortgang-strip">
    <div class="voortgang-balk"><i id="vakBalk" style="width:0"></i></div>
    <span class="voortgang-tekst" id="vakVoortgang"></span>
  </div>

  <div class="vak-grid" style="margin-top:32px;">
    <div class="vak-kolom vak-hoofd">
      <div class="vak-blok">
        <h2>Vak informatie</h2>
        <div id="hoofdstukken"></div>
      </div>
    </div>

    <aside class="vak-kolom vak-dl">
      <div class="vak-blok">
        <h2>Deadlines</h2>
        <div id="deadlines"></div>
        <div class="dl-form">
          <input type="text" id="dlTitel" placeholder="Wat moet af?" autocomplete="off">
          <input type="date" id="dlDatum">
          <button type="button" id="dlToevoegen">Toevoegen</button>
        </div>
      </div>
    </aside>

    <aside class="vak-kolom vak-man">
      <div class="vak-blok" id="manualBlok">
        <h2>Course manual</h2>
        <div id="manual"></div>
      </div>
    </aside>
  </div>
</div>

<div class="melding" id="melding" hidden></div>

<script src="rooster.js"></script>
<script src="app.js"></script>
<script src="lesblokken.js"></script>
<script src="lesstof.js"></script>
<script src="ssms-inhoud.js"></script>
<script src="vak.js"></script>
<script src="society-slides.js"></script>
</body>
</html>
